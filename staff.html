<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Application | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #5865F2;
            --primary-dark: #4752C4;
            --secondary: #57F287;
            --danger: #ED4245;
            --text: #2C2F33;
            --light: #F8F9FA;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text);
            overflow-x: hidden;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            transform-style: preserve-3d;
            transition: all 0.5s ease;
        }
        
        .container:hover {
            transform: translateY(-5px) rotateX(1deg);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--secondary);
            border-radius: 2px;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
        }
        
        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5ee;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s;
            background: var(--light);
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.2);
            outline: none;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .checkbox-container input {
            margin-right: 10px;
            width: auto;
        }
        
        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(45deg);
            transition: all 0.3s;
        }
        
        button:hover::after {
            left: 100%;
        }
        
        .success {
            text-align: center;
            color: var(--secondary);
            font-weight: 600;
            margin-top: 20px;
            display: none;
            font-size: 18px;
            animation: bounceIn 0.5s;
        }
        
        .error {
            color: var(--danger);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .security-badge i {
            color: var(--secondary);
            margin-right: 8px;
            font-size: 18px;
        }
        
        .floating-icons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .floating-icon {
            position: absolute;
            opacity: 0.1;
            color: var(--primary);
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
            100% {
                transform: translateY(0) rotate(360deg);
            }
        }
        
        .progress-bar {
            height: 5px;
            background: #e1e5ee;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
        }
        
        .progress {
            height: 100%;
            width: 0;
            background: var(--secondary);
            transition: width 0.3s;
        }
        
        .form-step {
            display: none;
        }
        
        .form-step.active {
            display: block;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e1e5ee;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-weight: 600;
            color: #888;
            position: relative;
        }
        
        .step.active {
            background: var(--primary);
            color: white;
        }
        
        .step.completed {
            background: var(--secondary);
            color: white;
        }
        
        .step::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -20px;
            width: 20px;
            height: 2px;
            background: #e1e5ee;
        }
        
        .step:first-child::before {
            display: none;
        }
        
        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .navigation-buttons button {
            width: 48%;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #99aab5 0%, #2c3e50 100%);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.4);
        }
        
        .character-counter {
            text-align: right;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 5px;
            cursor: pointer;
        }
        
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            font-weight: normal;
        }
        
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="floating-icons" id="floatingIcons"></div>
    
    <div class="container animate__animated animate__fadeIn">
        <h1>STAFF APPLICATION</h1>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress" id="progress"></div>
        </div>
        
        <div class="step-indicator">
            <div class="step active" id="step1">1</div>
            <div class="step" id="step2">2</div>
            <div class="step" id="step3">3</div>
        </div>
        
        <form id="applicationForm">
            <!-- Step 1 -->
            <div class="form-step active" id="step-1">
                <div class="form-group" style="animation-delay: 0.1s">
                    <label for="discord">Discord Username <span class="tooltip">🛈<span class="tooltiptext">Your full Discord username (e.g., User#1234)</span></span></label>
                    <input type="text" id="discord" placeholder="Your Discord username (e.g., User#1234)" required>
                    <div class="error" id="discordError"></div>
                </div>
                
                <div class="form-group" style="animation-delay: 0.2s">
                    <label for="realName">Real Name (optional)</label>
                    <input type="text" id="realName" placeholder="Your real name">
                </div>
                
                <div class="form-group" style="animation-delay: 0.3s">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Your age" min="13" max="99" required>
                    <div class="error" id="ageError"></div>
                </div>
                
                <button type="button" class="next-btn" style="animation-delay: 0.4s">Next</button>
            </div>
            
            <!-- Step 2 -->
            <div class="form-step" id="step-2">
                <div class="form-group" style="animation-delay: 0.1s">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="" disabled selected>Select your gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Non-binary">Non-binary</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
                
                <div class="form-group" style="animation-delay: 0.2s">
                    <label for="experience">Previous Experience <span class="tooltip">🛈<span class="tooltiptext">Any previous staff experience on Discord or other platforms</span></span></label>
                    <textarea id="experience" placeholder="Describe any previous moderation/staff experience you have..."></textarea>
                    <div class="character-counter"><span id="experienceCounter">0</span>/500</div>
                </div>
                
                <div class="navigation-buttons">
                    <button type="button" class="btn-secondary prev-btn">Back</button>
                    <button type="button" class="next-btn">Next</button>
                </div>
            </div>
            
            <!-- Step 3 -->
            <div class="form-step" id="step-3">
                <div class="form-group" style="animation-delay: 0.1s">
                    <label for="reason">Why do you want to join our staff team? <span class="tooltip">🛈<span class="tooltiptext">Explain why you're interested and what you can bring to the team</span></span></label>
                    <textarea id="reason" placeholder="Explain why you want to be part of our staff team..." required></textarea>
                    <div class="character-counter"><span id="reasonCounter">0</span>/1000</div>
                    <div class="error" id="reasonError"></div>
                </div>
                
                <div class="form-group" style="animation-delay: 0.2s">
                    <label for="availability">Availability <span class="tooltip">🛈<span class="tooltiptext">Your typical availability (hours per week, timezone, etc.)</span></span></label>
                    <textarea id="availability" placeholder="Your typical availability (timezone, hours per week, etc.)"></textarea>
                    <div class="character-counter"><span id="availabilityCounter">0</span>/300</div>
                </div>
                
                <div class="form-group" style="animation-delay: 0.3s">
                    <div class="checkbox-container">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#" style="color: var(--primary);">terms and conditions</a></label>
                    </div>
                    <div class="error" id="termsError"></div>
                </div>
                
                <div class="navigation-buttons">
                    <button type="button" class="btn-secondary prev-btn">Back</button>
                    <button type="submit" id="submitBtn">Submit Application</button>
                </div>
            </div>
        </form>
        
        <div class="success" id="successMessage">
            <i class="fas fa-check-circle" style="font-size: 50px; margin-bottom: 15px;"></i>
            <h2>Application Submitted!</h2>
            <p>Thank you for applying to our staff team. We'll review your application and get back to you soon.</p>
        </div>
        
        <div class="security-badge">
            <i class="fas fa-lock"></i>
            <span>Secure Encrypted Connection</span>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
    <script>
        // Webhook security - obfuscated and split
        const webhookParts = [
            'https://discord.com/api/webhooks/',
            '1371480783184728194/',
            't0WJXmAV9kLZX3Utv7XoA8G2-',
            'gnp6FR34gT2baZmXQ86rQ_Tdephvmd0j8NzhAPnBHBL'
        ];
        
        // Dynamic webhook assembly with timeout
        function getWebhook() {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve(webhookParts.join(''));
                }, 500);
            });
        }
        
        // Form steps functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize floating icons
            initFloatingIcons();
            
            // Initialize particles
            initParticles();
            
            // Form steps
            const formSteps = document.querySelectorAll('.form-step');
            const steps = document.querySelectorAll('.step');
            const nextBtns = document.querySelectorAll('.next-btn');
            const prevBtns = document.querySelectorAll('.prev-btn');
            const progressBar = document.getElementById('progressBar');
            const progress = document.getElementById('progress');
            
            let currentStep = 0;
            
            // Show current step
            function showStep(stepIndex) {
                formSteps.forEach((step, index) => {
                    step.classList.toggle('active', index === stepIndex);
                    
                    // Reset animations for the new step
                    if (index === stepIndex) {
                        const formGroups = step.querySelectorAll('.form-group');
                        formGroups.forEach((group, i) => {
                            group.style.animationDelay = `${0.1 * (i + 1)}s`;
                            group.classList.remove('animate__animated', 'animate__fadeInUp');
                            void group.offsetWidth; // Trigger reflow
                            group.classList.add('animate__animated', 'animate__fadeInUp');
                        });
                    }
                });
                
                // Update step indicators
                steps.forEach((step, index) => {
                    if (index < stepIndex) {
                        step.classList.add('completed');
                        step.classList.remove('active');
                    } else if (index === stepIndex) {
                        step.classList.add('active');
                        step.classList.remove('completed');
                    } else {
                        step.classList.remove('active', 'completed');
                    }
                });
                
                // Update progress bar
                if (stepIndex > 0) {
                    progressBar.style.display = 'block';
                    const progressPercent = (stepIndex / (formSteps.length - 1)) * 100;
                    progress.style.width = `${progressPercent}%`;
                } else {
                    progressBar.style.display = 'none';
                }
                
                currentStep = stepIndex;
            }
            
            // Next button click
            nextBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    if (validateStep(currentStep)) {
                        showStep(currentStep + 1);
                    }
                });
            });
            
            // Previous button click
            prevBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    showStep(currentStep - 1);
                });
            });
            
            // Character counters
            document.getElementById('reason').addEventListener('input', function() {
                document.getElementById('reasonCounter').textContent = this.value.length;
            });
            
            document.getElementById('experience').addEventListener('input', function() {
                document.getElementById('experienceCounter').textContent = this.value.length;
            });
            
            document.getElementById('availability').addEventListener('input', function() {
                document.getElementById('availabilityCounter').textContent = this.value.length;
            });
            
            // Form submission
            document.getElementById('applicationForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (validateStep(currentStep)) {
                    const submitBtn = document.getElementById('submitBtn');
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
                    
                    try {
                        const formData = {
                            discord: document.getElementById('discord').value,
                            realName: document.getElementById('realName').value,
                            age: document.getElementById('age').value,
                            gender: document.getElementById('gender').value,
                            experience: document.getElementById('experience').value,
                            reason: document.getElementById('reason').value,
                            availability: document.getElementById('availability').value
                        };
                        
                        // Get webhook URL dynamically
                        const webhookUrl = await getWebhook();
                        
                        // Send to Discord webhook
                        await fetch(webhookUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                embeds: [{
                                    title: "✍️ New Staff Application",
                                    color: 0x5865F2,
                                    fields: [
                                        { name: "🔹 Discord", value: formData.discord || "Not provided", inline: true },
                                        { name: "🔹 Name", value: formData.realName || "Not provided", inline: true },
                                        { name: "🔹 Age", value: formData.age || "Not provided", inline: true },
                                        { name: "🔹 Gender", value: formData.gender || "Not provided", inline: true },
                                        { name: "📝 Experience", value: formData.experience.substring(0, 1000) || "Not provided" },
                                        { name: "📝 Reason for Applying", value: formData.reason.substring(0, 1000) || "Not provided" },
                                        { name: "⏰ Availability", value: formData.availability.substring(0, 300) || "Not provided" }
                                    ],
                                    timestamp: new Date().toISOString(),
                                    footer: { text: "New application submitted" }
                                }]
                            })
                        });
                        
                        // Show success message
                        document.getElementById('applicationForm').style.display = 'none';
                        document.getElementById('successMessage').style.display = 'block';
                        
                        // Confetti effect
                        createConfetti();
                        
                    } catch (error) {
                        alert('An error occurred while submitting your application. Please try again.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Submit Application';
                    }
                }
            });
            
            // Initial step
            showStep(0);
        });
        
        // Form validation
        function validateStep(stepIndex) {
            let isValid = true;
            
            if (stepIndex === 0) {
                const discord = document.getElementById('discord');
                const age = document.getElementById('age');
                
                // Discord validation
                if (!discord.value.trim()) {
                    document.getElementById('discordError').textContent = 'Discord username is required';
                    document.getElementById('discordError').style.display = 'block';
                    isValid = false;
                } else {
                    document.getElementById('discordError').style.display = 'none';
                }
                
                // Age validation
                if (!age.value) {
                    document.getElementById('ageError').textContent = 'Age is required';
                    document.getElementById('ageError').style.display = 'block';
                    isValid = false;
                } else if (age.value < 13) {
                    document.getElementById('ageError').textContent = 'You must be at least 13 years old';
                    document.getElementById('ageError').style.display = 'block';
                    isValid = false;
                } else {
                    document.getElementById('ageError').style.display = 'none';
                }
            } else if (stepIndex === 2) {
                const reason = document.getElementById('reason');
                const terms = document.getElementById('terms');
                
                // Reason validation
                if (!reason.value.trim()) {
                    document.getElementById('reasonError').textContent = 'Please explain why you want to join';
                    document.getElementById('reasonError').style.display = 'block';
                    isValid = false;
                } else if (reason.value.trim().length < 50) {
                    document.getElementById('reasonError').textContent = 'Please provide more details (at least 50 characters)';
                    document.getElementById('reasonError').style.display = 'block';
                    isValid = false;
                } else {
                    document.getElementById('reasonError').style.display = 'none';
                }
                
                // Terms validation
                if (!terms.checked) {
                    document.getElementById('termsError').textContent = 'You must accept the terms and conditions';
                    document.getElementById('termsError').style.display = 'block';
                    isValid = false;
                } else {
                    document.getElementById('termsError').style.display = 'none';
                }
            }
            
            return isValid;
        }
        
        // Floating icons animation
        function initFloatingIcons() {
            const icons = ['💻', '📱', '🔒', '🛡️', '📝', '👨‍💻', '👩‍💻', '⚙️', '🔧', '📊'];
            const container = document.getElementById('floatingIcons');
            
            for (let i = 0; i < 15; i++) {
                const icon = document.createElement('div');
                icon.className = 'floating-icon';
                icon.textContent = icons[Math.floor(Math.random() * icons.length)];
                icon.style.left = `${Math.random() * 100}%`;
                icon.style.top = `${Math.random() * 100}%`;
                icon.style.fontSize = `${Math.random() * 20 + 10}px`;
                icon.style.animationDuration = `${Math.random() * 20 + 10}s`;
                icon.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(icon);
            }
        }
        
        // Simple particles animation
        function initParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = `${Math.random() * 5 + 2}px`;
                particle.style.height = particle.style.width;
                particle.style.backgroundColor = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.1})`;
                particle.style.borderRadius = '50%';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.opacity = '0';
                
                // Animate opacity
                particle.animate([
                    { opacity: 0 },
                    { opacity: 1 },
                    { opacity: 0 }
                ], {
                    duration: Math.random() * 10000 + 5000,
                    iterations: Infinity,
                    delay: Math.random() * 5000
                });
                
                // Floating animation
                const keyframes = [
                    { transform: `translate(0, 0)` },
                    { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)` }
                ];
                
                particle.animate(keyframes, {
                    duration: Math.random() * 20000 + 10000,
                    iterations: Infinity,
                    direction: 'alternate',
                    easing: 'ease-in-out'
                });
                
                container.appendChild(particle);
            }
        }
        
        // Confetti effect
        function createConfetti() {
            const colors = ['#5865F2', '#57F287', '#FEE75C', '#EB459E', '#ED4245'];
            const container = document.querySelector('.container');
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = `${Math.random() * 10 + 5}px`;
                confetti.style.height = `${Math.random() * 10 + 5}px`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.top = '-10px';
                confetti.style.borderRadius = '50%';
                confetti.style.zIndex = '1000';
                confetti.style.opacity = '0';
                
                container.appendChild(confetti);
                
                // Animate
                const animation = confetti.animate([
                    { 
                        transform: 'translateY(0) rotate(0deg)',
                        opacity: 0 
                    },
                    { 
                        transform: `translateY(${Math.random() * 300 + 100}px) rotate(${Math.random() * 360}deg)`,
                        opacity: 1 
                    },
                    { 
                        transform: `translateY(${Math.random() * 300 + 400}px) rotate(${Math.random() * 720}deg)`,
                        opacity: 0 
                    }
                ], {
                    duration: Math.random() * 3000 + 2000,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
                });
                
                animation.onfinish = () => confetti.remove();
            }
        }
        
        // Anti-tampering measures
        Object.defineProperty(window, 'webhookParts', {
            configurable: false,
            writable: false
        });
        
        // Prevent viewing source
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                alert('Viewing source is disabled for security reasons.');
            }
        });
        
        // Right-click disable
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            alert('Right-click is disabled for security reasons.');
        });
    </script>
</body>
</html>
