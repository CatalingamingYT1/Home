<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #5865F2;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            background: #5865F2;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #4752C4;
        }
        .success {
            text-align: center;
            color: #43b581;
            font-weight: 500;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Staff Application</h1>
        
        <form id="applicationForm">
            <div class="form-group">
                <label>Discord Username</label>
                <input type="text" placeholder="Numele tău de Discord (cu sau fără #)" required>
            </div>
            
            <div class="form-group">
                <label>Numele tău real (opțional)</label>
                <input type="text" placeholder="Cum te numești">
            </div>
            
            <div class="form-group">
                <label>Gen</label>
                <select required>
                    <option value="" disabled selected>Selectează</option>
                    <option value="Masculin">Masculin</option>
                    <option value="Feminin">Feminin</option>
                    <option value="Altul">Altul</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>De ce vrei să fii în staff?</label>
                <textarea required placeholder="Scrie motivul tău aici..."></textarea>
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" required> Accept termenii și condițiile
                </label>
            </div>
            
            <button type="submit">Send Application</button>
        </form>
        
        <div class="success" id="successMessage">
            Aplicația a fost trimisă cu succes!
        </div>
    </div>

    <script>
        document.getElementById('applicationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const button = form.querySelector('button');
            const successMsg = document.getElementById('successMessage');
            
            // Show loading state
            button.disabled = true;
            button.textContent = 'Se trimite...';
            
            // Get form data
            const inputs = form.querySelectorAll('input, textarea, select');
            const formData = {
                discord: inputs[0].value,
                name: inputs[1].value,
                gender: inputs[2].value,
                reason: inputs[3].value
            };
            
            try {
                // Send to Discord webhook
                await fetch('https://discord.com/api/webhooks/1371480783184728194/t0WJXmAV9kLZX3Utv7XoA8G2-gnp6FR34gT2baZmXQ86rQ_Tdephvmd0j8NzhAPnBHBL', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "✍️ New Staff Application",
                            color: 0x5865F2,
                            fields: [
                                { name: "🔹 Discord", value: formData.discord || "N/A" },
                                { name: "🔹 Nume", value: formData.name || "N/A" },
                                { name: "🔹 Gen", value: formData.gender || "N/A" },
                                { name: "📝 Motiv", value: formData.reason || "N/A" }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    })
                });
                
                // Show success
                form.style.display = 'none';
                successMsg.style.display = 'block';
                
            } catch (error) {
                alert('Eroare la trimitere. Încearcă din nou.');
                button.disabled = false;
                button.textContent = 'Send Application';
            }
        });
    </script>
</body>
</html>
