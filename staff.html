<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #5865F2;
            --primary-dark: #4752C4;
            --text-color: #2C2F33;
            --light-gray: #f5f5f5;
            --border-color: #ddd;
            --success-color: #43b581;
            --error-color: #f04747;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f9f9f9;
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            transform: translateY(0);
            opacity: 1;
            transition: all 0.5s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease forwards;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }

        .input-with-verification {
            display: flex;
            gap: 10px;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .verify-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 0 15px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .verify-btn:hover {
            background-color: var(--primary-dark);
        }

        .verification-result {
            margin-top: 8px;
            font-size: 14px;
            min-height: 20px;
        }

        .verification-result.valid {
            color: var(--success-color);
        }

        .verification-result.invalid {
            color: var(--error-color);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            padding-left: 30px;
        }

        .radio-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-custom {
            position: absolute;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: white;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            transition: all 0.3s;
        }

        .radio-option:hover .radio-custom {
            border-color: var(--primary-color);
        }

        .radio-option input:checked ~ .radio-custom {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
        }

        .radio-option input:checked ~ .radio-custom::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            padding-left: 30px;
        }

        .checkbox-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkbox-custom {
            position: absolute;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: white;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            transition: all 0.3s;
        }

        .checkbox-option:hover .checkbox-custom {
            border-color: var(--primary-color);
        }

        .checkbox-option input:checked ~ .checkbox-custom {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
        }

        .checkbox-option input:checked ~ .checkbox-custom::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }

        .submit-btn .btn-text {
            display: inline-block;
            transition: opacity 0.3s;
        }

        .submit-btn .btn-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .submit-btn.loading .btn-text {
            opacity: 0;
        }

        .submit-btn.loading .btn-loader {
            opacity: 1;
        }

        .success-message {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .success-message.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .success-icon {
            font-size: 60px;
            color: var(--success-color);
            margin-bottom: 20px;
            animation: bounce 0.6s;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        .success-message h2 {
            color: var(--success-color);
            margin-bottom: 10px;
        }

        .success-message p {
            color: #666;
        }

        /* CAPTCHA Styles */
        .captcha-container {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .captcha-challenge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 18px;
            color: #333;
            justify-content: center;
        }

        .captcha-challenge span {
            background: #ddd;
            padding: 5px 10px;
            border-radius: 3px;
            letter-spacing: 2px;
        }

        .captcha-input {
            display: flex;
            gap: 10px;
        }

        .captcha-input input {
            flex: 1;
        }

        .refresh-captcha {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 18px;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="header">
                <h1><i class="fas fa-users-cog"></i> Staff Application</h1>
                <p>Complete this form to apply for our staff team</p>
            </div>
            
            <form id="applicationForm">
                <div class="form-group">
                    <label for="discordUsername">Discord Username</label>
                    <div class="input-with-verification">
                        <input type="text" id="discordUsername" name="discordUsername" placeholder="Username#0000" required>
                        <button type="button" id="verifyUser" class="verify-btn">Verify</button>
                    </div>
                    <div id="verificationResult" class="verification-result"></div>
                </div>
                
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="13" max="99" required>
                </div>
                
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="gender" value="Male" required>
                            <span class="radio-custom"></span>
                            Male
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="gender" value="Female">
                            <span class="radio-custom"></span>
                            Female
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="gender" value="Other">
                            <span class="radio-custom"></span>
                            Other
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="reason">Why do you want to be part of our staff team?</label>
                    <textarea id="reason" name="reason" rows="4" required></textarea>
                </div>
                
                <!-- Simple CAPTCHA -->
                <div class="form-group captcha-container" id="captchaContainer">
                    <div class="captcha-challenge">
                        <span id="captchaText"></span>
                        <button type="button" class="refresh-captcha" id="refreshCaptcha">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div class="captcha-input">
                        <input type="text" id="captchaInput" placeholder="Enter the CAPTCHA" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-option">
                        <input type="checkbox" id="acceptTerms" name="acceptTerms" required>
                        <span class="checkbox-custom"></span>
                        I accept the terms and conditions
                    </label>
                </div>
                
                <button type="submit" id="submitBtn" class="submit-btn">
                    <span class="btn-text">Submit Application</span>
                    <span class="btn-loader"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
            </form>
        </div>
        
        <div class="success-message" id="successMessage">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Application Submitted!</h2>
            <p>Thank you for applying. We'll review your application soon.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('applicationForm');
            const verifyBtn = document.getElementById('verifyUser');
            const discordUsernameInput = document.getElementById('discordUsername');
            const verificationResult = document.getElementById('verificationResult');
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');
            const formContainer = document.querySelector('.form-container');
            const captchaText = document.getElementById('captchaText');
            const captchaInput = document.getElementById('captchaInput');
            const refreshCaptcha = document.getElementById('refreshCaptcha');
            
            let currentCaptcha = '';
            
            // Generate simple CAPTCHA
            function generateCaptcha() {
                const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                let captcha = '';
                for (let i = 0; i < 6; i++) {
                    captcha += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                currentCaptcha = captcha;
                captchaText.textContent = captcha;
                captchaInput.value = '';
            }
            
            // Initialize CAPTCHA
            generateCaptcha();
            refreshCaptcha.addEventListener('click', generateCaptcha);
            
            // Discord username verification
            verifyBtn.addEventListener('click', function() {
                const username = discordUsernameInput.value.trim();
                
                if (!username) {
                    verificationResult.textContent = 'Please enter a Discord username';
                    verificationResult.className = 'verification-result invalid';
                    return;
                }
                
                const discordRegex = /^(?:(?<username>[^#@:]{2,32})#(?<discriminator>\d{4})|(?<newUsername>[^#@:]{2,32})$/;
                
                if (!discordRegex.test(username)) {
                    verificationResult.textContent = 'Invalid Discord username format';
                    verificationResult.className = 'verification-result invalid';
                    return;
                }
                
                verificationResult.textContent = 'Verifying...';
                verificationResult.className = 'verification-result';
                
                setTimeout(() => {
                    const isVerified = Math.random() > 0.3;
                    
                    if (isVerified) {
                        verificationResult.textContent = 'Username verified ✔';
                        verificationResult.className = 'verification-result valid';
                    } else {
                        verificationResult.textContent = 'Username not found. Please check and try again.';
                        verificationResult.className = 'verification-result invalid';
                    }
                }, 1500);
            });
            
            // Form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Validate CAPTCHA
                if (captchaInput.value.toUpperCase() !== currentCaptcha) {
                    alert('CAPTCHA verification failed. Please try again.');
                    generateCaptcha();
                    return;
                }
                
                // Validate form
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                
                submitBtn.classList.add('loading');
                
                const formData = {
                    discordUsername: discordUsernameInput.value.trim(),
                    age: document.getElementById('age').value,
                    gender: document.querySelector('input[name="gender"]:checked').value,
                    reason: document.getElementById('reason').value.trim(),
                    timestamp: new Date().toISOString()
                };
                
                try {
                    // Send to Discord webhook
                    const response = await sendToDiscordWebhook(formData);
                    
                    if (response.ok) {
                        showSuccess();
                    } else {
                        throw new Error('Failed to send to Discord');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while submitting your application. Please try again later.');
                    submitBtn.classList.remove('loading');
                }
            });
            
            async function sendToDiscordWebhook(formData) {
                const webhookURL = 'https://discord.com/api/webhooks/1371480783184728194/t0WJXmAV9kLZX3Utv7XoA8G2-gnp6FR34gT2baZmXQ86rQ_Tdephvmd0j8NzhAPnBHBL';
                
                const embed = {
                    title: "✍️ New Staff Application",
                    color: 0x5865F2,
                    fields: [
                        { name: "🔹 Discord Username", value: formData.discordUsername, inline: true },
                        { name: "🔹 Age", value: formData.age, inline: true },
                        { name: "🔹 Gender", value: formData.gender, inline: true },
                        { name: "📝 Reason for Applying", value: formData.reason || "*Not provided*", inline: false },
                        { name: "⏰ Submitted At", value: new Date(formData.timestamp).toLocaleString(), inline: false }
                    ],
                    footer: { text: "Staff Application System" },
                    timestamp: new Date().toISOString()
                };
                
                const payload = {
                    username: "Application Bot",
                    embeds: [embed]
                };
                
                return await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }
            
            function showSuccess() {
                submitBtn.classList.remove('loading');
                formContainer.classList.add('hidden');
                successMessage.classList.add('show');
                
                setTimeout(() => {
                    form.reset();
                    verificationResult.textContent = '';
                    verificationResult.className = 'verification-result';
                    formContainer.classList.remove('hidden');
                    successMessage.classList.remove('show');
                    generateCaptcha();
                }, 5000);
            }
        });
    </script>
</body>
</html>
